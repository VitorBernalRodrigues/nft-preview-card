<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equilibria | NFT Gallery</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <!-- Fonte Outfit, a mesma do design do Frontend Mentor -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Animate.css: animações prontas usadas nos cards -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 class="section-title animate__animated animate__fadeInDown">Featured collection</h1>
    <p class="section-subtitle animate__animated animate__fadeIn">Discover unique digital art from independent creators.</p>

    <!-- O JavaScript coloca os cards aqui dentro -->
    <section id="cards" class="cards"></section>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
      Coded by Vitor, Mateus and Gustavo.
    </footer>
  </main>

  <!-- Componentes (a ordem importa: o main.js vem por último) -->
  <script src="js/data.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/card-list.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
