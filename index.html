<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT preview card</title>
  <!-- Fonte Outfit, a mesma do design do Frontend Mentor -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <!-- Card NFT do desafio -->
    <article class="card">
      <a href="#" class="card__image">
        <img src="images/image-equilibrium.svg" alt="Equilibrium NFT artwork" class="card__picture">
      </a>

      <h1 class="card__title"><a href="#">Equilibrium #3429</a></h1>
      <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>

      <div class="card__info">
        <span class="card__price"><img src="images/icon-ethereum.svg" alt="">0.041 ETH</span>
        <span class="card__time"><img src="images/icon-clock.svg" alt="">3 days left</span>
      </div>

      <div class="card__creator">
        <img src="images/image-avatar.svg" alt="" class="card__avatar">
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </div>
    </article>
  </main>
</body>
</html>
